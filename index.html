<script>
(function(){ // 오류가 나면 화면 왼쪽 아래에 원인을 표시(정상일 때는 아무것도 보이지 않음)
  function show(msg){ var b=document.getElementById('djError'); if(!b){ b=document.createElement('div'); b.id='djError';
    b.style.cssText='position:fixed;left:12px;bottom:12px;z-index:99999;max-width:60vw;padding:8px 10px;background:#111;color:#FFFF00;font:11px/1.4 monospace;border:1px solid #FFFF00;white-space:pre-wrap';
    (document.body||document.documentElement).appendChild(b);} b.textContent+=(b.textContent?'\n':'')+'⚠ '+msg; }
  addEventListener('error',function(e){ var t=e.target; if(t&&t!==window){ if(t.tagName==='SCRIPT') show('파일을 불러오지 못함: '+t.src); } else if(e.message) show(e.message+(e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':'')); },true);
  addEventListener('unhandledrejection',function(e){ var r=e.reason; if(r&&/MediaPipe|jsdelivr|fontshare/i.test(String(r&&r.message||r))) return; show(String(r&&r.message||r)); });
})();
</script>
